# Redact any accidentally supplied query-string credential parameters from access logs
map $request_uri $redacted_request_uri {
    ~^(?<prefix>.*[?&](?:token|api_key|secret|password)=)[^&]+(?<suffix>.*)$ "${prefix}[REDACTED]${suffix}";
    default $request_uri;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

log_format drillai_redacted '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $redacted_request_uri $server_protocol" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" "$http_x_forwarded_for"';

limit_req_zone $binary_remote_addr zone=drillai_auth_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=drillai_api_limit:10m rate=60r/s;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/access.log drillai_redacted;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # Baseline HTTP security headers (applied on 2xx/3xx/4xx/5xx via `always`)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Stricter rate limit on authentication & password endpoints
    location /api/v1/auth/ {
        limit_req zone=drillai_auth_limit burst=20 nodelay;
        proxy_pass http://backend:8000/api/v1/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Proxy REST and WebSocket API traffic to backend
    location /api/ {
        limit_req zone=drillai_api_limit burst=120 nodelay;
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
