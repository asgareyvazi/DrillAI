[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drillai-backend"
version = "0.1.0"
description = "DrillAI — Well Engineering Intelligence Platform (backend core)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  # --- web / API ---
  "fastapi>=0.115,<0.117",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  # --- contracts / validation ---
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6",
  # --- persistence ---
  "SQLAlchemy>=2.0.36,<2.1",
  "alembic>=1.13",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  # --- engineering numerics ---
  "numpy>=1.26",
  # --- document intelligence (pure-python extractors) ---
  "pypdf>=5.1",
  "python-docx>=1.1",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "pgserver>=0.1.4",   # embedded PostgreSQL for real-Postgres integration tests
]
# Optional heavy adapters — enabled only when the deployment needs them.
vector = ["pgvector>=0.3"]

[project.scripts]
drillai-worker = "drillai.telemetry.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/drillai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests.api.conftest` is imported by name, so the project root has to be importable no matter how
# pytest was invoked (`pytest`, `python -m pytest`, or a runner with a different CWD).
pythonpath = ["."]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
  "postgres: integration test that requires a real PostgreSQL instance",
  "slow: longer-running verification test",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# RUF001/RUF002 flag deliberately used engineering and typographic symbols in docstrings and
# messages: the minus sign "−", the multiplication sign "×", Greek letters (rho, tau) and
# degree marks. They carry meaning in engineering text and are not typos.
ignore = ["E501", "B008", "SIM108", "RUF012", "RUF001", "RUF002"]

[tool.ruff.lint.isort]
known-first-party = ["drillai"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B017"]
