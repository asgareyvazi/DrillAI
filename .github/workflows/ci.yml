# DrillAI — the certification pipeline.
#
# One workflow, because the repository has one definition of "verified": the same commands
# `docs/FRONTEND_TESTING.md` documents and `scripts/bootstrap.sh` prepares. CI adds nothing to the
# architecture — it runs the repository's own scripts, in the order a reviewer would, and fails when
# any of them fails.
#
# What it is not: it never writes to the repository, never pushes, never uses a secret, and never
# turns a failing gate into a passing one. Each required step is its own step, so a red run names the
# gate that failed instead of hiding it inside a shell script.
#
# Each testing gate certifies its own result rather than trusting its inputs. The backend gate compares
# the complete pytest totals and exact PostgreSQL node IDs with the reviewed shared inventory; the
# end-to-end gate separately validates collection and actual browser execution against that manifest;
# the unit gate fails on a skip. That
# matters because GitHub serves raw logs from Azure blob storage, which some networks cannot reach:
# what stays readable everywhere — including through the API — is the step's own conclusion, so a green
# step has to mean the property held. Each gate therefore normalises the ANSI escapes the runner adds
# before parsing: the first version of this did not, and refused a run that had in fact passed. The counts are also written to the run summary for humans who
# open the run, and `set -o pipefail` keeps each command's exit status as the step's.
#
# The end-to-end suite is the real stack: the real FastAPI service on a freshly seeded SQLite
# database, the real Vite server, and a real browser — three of them, in fact, because the suite runs
# in three deployments (development identity, fault injection, authentication enabled). Nothing is
# intercepted in the browser; see `frontend/e2e/`.

name: CI

on:
  push:
    # Arena session branches are independent release candidates; certify the active working branch too.
    branches: ['arena/**']
  pull_request:
    branches: [arena/01a0dca0-drillai, main]
  # Manual runs, so the pipeline can be re-certified at a chosen commit without pushing anything.
  workflow_dispatch:

# Read-only, and only what is used. The workflow publishes nothing back to the repository.
permissions:
  contents: read

# Two certification runs on the same ref would fight over the same ports and the same `.e2e` database.
# A superseded run is cancelled rather than allowed to race the newer one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The backend declares `requires-python = ">=3.11"`; CI certifies that baseline, not a newer one.
  PYTHON_VERSION: '3.11'
  # Node 22 LTS: the version this repository was last verified with (`.nvmrc`-less, so it is pinned
  # here and printed in the log).
  NODE_VERSION: '22'
  # Embedded PostgreSQL (the `pgserver` dev dependency) so all reviewed PostgreSQL-marked tests run
  # instead of skipping. Their exact node IDs are checked against ci/test-inventory.json.
  DRILLAI_TEST_POSTGRES: '1'

jobs:
  certification:
    name: install, verify, and run the real end-to-end suite
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Provenance first, so every number in the log below is tied to a commit rather than to a
      # branch name that has since moved.
      - name: Provenance
        run: |
          echo "commit:  $(git rev-parse HEAD)"
          echo "branch:  $(git branch --show-current)"
          echo "subject: $(git log -1 --oneline)"
          echo "dirty:"
          git status --porcelain

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Record the toolchain
        run: |
          python --version
          python -m pip --version
          node --version
          npm --version

      # ------------------------------------------------------------------ install
      # The backend is installed exactly through the project metadata, into the same
      # `backend/.venv` a developer gets from `scripts/bootstrap.sh` — the end-to-end suite starts the
      # service with that interpreter (`frontend/e2e/start-api.mjs`), so the path is part of the
      # contract, not a convenience.
      - name: Install the backend (editable, dev + OCR test extras)
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip "setuptools>=83.0.0"
          backend/.venv/bin/python -m pip install -e "backend[dev,ocr]"

      # The lockfile is authoritative: `npm ci` installs exactly what is committed and fails if the
      # lockfile and the manifest disagree. It is never regenerated here.
      - name: Install the frontend (npm ci)
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # ------------------------------------------------------------------ frontend gates
      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      # A skipped unit test is not a pass: the gate reads its own result line and fails on one, so a
      # green step means the whole suite ran.
      - name: Frontend unit and component tests
        working-directory: frontend
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/frontend-tests.log"
          # The runner enables colour, which wraps the lines these gates parse in ANSI escapes.
          # Normalise first, or a gate refuses a run that in fact passed — which is how this was found.
          plain="$RUNNER_TEMP/frontend-tests.plain"
          sed -e $'s/\x1b\\[[0-9;]*[a-zA-Z]//g' "$RUNNER_TEMP/frontend-tests.log" > "$plain"
          if ! summary="$(grep -E '^ *Tests +' "$plain" | tail -n 1)"; then
            echo "::error::the unit test run printed no result line"
            exit 1
          fi
          echo "result: $summary"
          case "$summary" in
            *skipped*) echo "::error::unit tests were skipped: $summary"; exit 1 ;;
            *passed*) ;;
            *) echo "::error::no pass summary was printed: $summary"; exit 1 ;;
          esac
          echo "::notice title=Frontend unit tests verified::$summary"
          {
            echo '### Frontend unit and component tests'
            echo '```'
            echo "$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Supply-chain, SHA-pinning, and secret-leakage verification
        run: backend/.venv/bin/python scripts/verify_supply_chain_and_secrets.py

      # ------------------------------------------------------------------ backend gates
      # No `-q` on the command line: `pyproject.toml` already sets it, and a second one suppresses the
      # summary line entirely — which is exactly the line this gate certifies from.
      - name: Backend tests (SQLite + embedded PostgreSQL)
        working-directory: backend
        run: |
          set -o pipefail
          set +e
          .venv/bin/python -m pytest 2>&1 | tee "$RUNNER_TEMP/backend-tests.log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          pytest_exit=${pipeline_status[0]:-1}
          tee_exit=${pipeline_status[1]:-1}
          if [ "$tee_exit" -ne 0 ]; then
            echo "::error::could not record the complete backend test log (tee exit=$tee_exit)"
            exit 1
          fi
          .venv/bin/python ../scripts/verify_backend_test_inventory.py \
            --platform linux \
            --log-file "$RUNNER_TEMP/backend-tests.log" \
            --pytest-exit-code "$pytest_exit"
          {
            echo '### Backend tests (DRILLAI_TEST_POSTGRES=1)'
            echo '```'
            tail -n 1 "$RUNNER_TEMP/backend-tests.log"
            echo 'PostgreSQL node IDs and result totals verified against ci/test-inventory.json.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Backend lint
        working-directory: backend
        run: .venv/bin/python -m ruff check .

      # Migration verification runs against a database created for this step, never against a
      # developer's database and never against one left over from an earlier run.
      - name: Migration check (fresh database)
        working-directory: backend
        env:
          DRILLAI_DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/ci-migration.db
        run: |
          rm -f "${{ runner.temp }}/ci-migration.db"
          .venv/bin/python -m alembic upgrade head
          .venv/bin/python -m alembic check

      - name: Multi-process stack verification (scripts/verify_stack.py)
        run: |
          set -o pipefail
          backend/.venv/bin/python scripts/verify_stack.py 2>&1 | tee "$RUNNER_TEMP/verify-stack.log"
          if ! grep -q "STACK_VERIFICATION_OK" "$RUNNER_TEMP/verify-stack.log"; then
            echo "::error::scripts/verify_stack.py did not print STACK_VERIFICATION_OK"
            exit 1
          fi
          {
            echo '### Multi-process stack verification'
            echo '```'
            grep "STACK_VERIFICATION_OK" "$RUNNER_TEMP/verify-stack.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Docker Compose deployment smoke gate (docker-compose.yml)
        env:
          POSTGRES_PASSWORD: ci_ephemeral_pg_password_9f8e7d
          DRILLAI_AUTH_ENABLED: 'false'
        run: |
          set -euo pipefail
          cleanup() {
            docker compose logs --tail=80 || true
            docker compose down -v --remove-orphans || true
          }
          trap cleanup EXIT
          # Name the command that failed. `curl -f` reports an HTTP error as exit code 22, which
          # on its own says nothing about *which* probe failed — the failure that this gate reported
          # as a bare "exit code 22" before the probe was proven against the application.
          trap 'echo "DEPLOYMENT_GATE_FAILED at line $LINENO: $BASH_COMMAND" >&2' ERR
          docker compose config -q
          docker compose up -d --build
          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/ready >/dev/null 2>&1 && \
               curl -fsS http://127.0.0.1:8080/api/v1/health/ready >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "DEPLOYMENT_GATE_FAILED: the stack did not become ready within 90 seconds." >&2
            exit 1
          fi
          # Execute the pinned bilingual synthetic quality measurement inside the exact backend
          # deployment image. The report contains metrics and fixture IDs only, never transcripts/PDFs.
          ocr_report="$RUNNER_TEMP/cp135-synthetic-ocr-quality.json"
          if ! docker compose exec -T backend python -m drillai.ingestion.ocr_synthetic_quality > "$ocr_report"; then
            cat "$ocr_report"
            # Keep the failure diagnosable even when GitHub's raw log endpoint is unavailable. The
            # annotation is deliberately limited to runtime, metric, stratum, and case-ID evidence;
            # the report itself contains no transcript, page image, local path, or uploaded content.
            python3 - "$ocr_report" <<'PY' || true
          import json
          import sys

          MAX_ANNOTATION_BYTES = 3800
          MAX_NOTICES = 9  # Leave the tenth per-step annotation slot for the hard failure.
          notices = []

          def emit(title, payload):
              message = json.dumps(payload, ensure_ascii=True, sort_keys=True, separators=(",", ":"))
              if len(message.encode("utf-8")) > MAX_ANNOTATION_BYTES:
                  raise ValueError("sanitized CP135 annotation exceeds its safe size bound")
              escaped = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              notices.append(f"::notice title={title}::{escaped}")

          def emit_batches(title, field, rows):
              batch = []
              first = 1
              for row in rows:
                  candidate = batch + [row]
                  message = json.dumps({field: candidate}, ensure_ascii=True, sort_keys=True, separators=(",", ":"))
                  if batch and len(message.encode("utf-8")) > MAX_ANNOTATION_BYTES:
                      last = first + len(batch) - 1
                      emit(f"{title} {first:03d}-{last:03d}", {field: batch})
                      first = last + 1
                      batch = [row]
                  else:
                      batch = candidate
              if batch:
                  last = first + len(batch) - 1
                  emit(f"{title} {first:03d}-{last:03d}", {field: batch})

          try:
              with open(sys.argv[1], encoding="utf-8") as source:
                  report = json.load(source)
          except (OSError, ValueError):
              report = {}
          if not isinstance(report, dict):
              report = {}

          dataset = report.get("dataset") if isinstance(report.get("dataset"), dict) else {}
          metrics = report.get("metrics") if isinstance(report.get("metrics"), dict) else {}
          runtime = report.get("runtime") if isinstance(report.get("runtime"), dict) else {}
          stratified = metrics.get("stratified_metrics") if isinstance(metrics.get("stratified_metrics"), dict) else {}
          case_fields = (
              "id", "language", "layout", "scan_condition", "status", "reason", "pdf_sha256", "cer", "wer",
              "character_errors", "expected_characters", "word_errors", "expected_words", "critical_fields_matched",
              "critical_fields_expected", "processing_ms", "recognition_ms",
          )
          metric_fields = (
              "case_count", "evaluated_cases", "incomplete_or_failed_cases", "character_errors", "expected_characters",
              "character_error_rate", "word_errors", "expected_words", "word_error_rate", "exact_case_rate",
              "critical_field_exact_rate", "critical_fields_matched", "critical_fields_expected", "median_case_processing_ms",
              "p95_case_processing_ms", "median_tesseract_ms", "p95_tesseract_ms", "total_elapsed_ms", "thresholds_passed",
              "all_strata_thresholds_passed",
          )
          runtime_fields = (
              "provider", "adapter_version", "page_segmentation_mode", "runtime_version", "python_version", "pdf_renderer_version",
              "renderer_dependencies", "resource_limits", "required_languages", "configured_languages", "available_languages",
          )
          summary = {
              "status": report.get("status"),
              "quality_evaluated": report.get("quality_evaluated"),
              "reason": report.get("reason"),
              "dataset": {key: dataset.get(key) for key in (
                  "id", "version", "classification", "sha256", "case_count", "languages", "stratification_dimensions",
              )},
              "thresholds": report.get("thresholds"),
              "runtime": {key: runtime.get(key) for key in runtime_fields},
              "metrics": {key: metrics.get(key) for key in metric_fields},
          }
          strata_summary = {}
          for dimension, rows in stratified.items():
              if isinstance(rows, list):
                  strata_summary[dimension] = [
                      {
                          "stratum": row.get("stratum"),
                          "cases": row.get("case_count"),
                          "evaluated": row.get("evaluated_cases"),
                          "incomplete": row.get("incomplete_or_failed_cases"),
                          "characters": [row.get("character_errors"), row.get("expected_characters"), row.get("character_error_rate")],
                          "words": [row.get("word_errors"), row.get("expected_words"), row.get("word_error_rate")],
                          "critical": [row.get("critical_fields_matched"), row.get("critical_fields_expected"), row.get("critical_field_exact_rate")],
                          "passed": row.get("thresholds_passed"),
                      }
                      for row in rows if isinstance(row, dict)
                  ]
          emit("CP135 OCR runtime, global and stratified metrics", {"summary": summary, "strata": strata_summary})

          cases = report.get("cases", [])
          if isinstance(cases, list):
              emit_batches(
                  "CP135 OCR cases",
                  "cases",
                  [{key: case.get(key) for key in case_fields} for case in cases if isinstance(case, dict)],
              )
          if len(notices) > MAX_NOTICES:
              raise ValueError("CP135 diagnostic exceeded the GitHub per-step annotation bound")
          for notice in notices:
              print(notice)
          PY
            echo "::error::the deployment-image synthetic OCR benchmark did not pass"
            exit 1
          fi
          ocr_summary="$(backend/.venv/bin/python scripts/verify_synthetic_ocr_quality.py \
            "$ocr_report" --corpus backend/src/drillai/ingestion/data/synthetic_ddr_ocr_quality_v2.json)"
          echo "$ocr_summary"
          echo "::notice title=CP135 synthetic OCR metrics::$ocr_summary"
          {
            echo '### CP135 deployment-image synthetic OCR quality (development-only evidence)'
            echo '```'
            echo "$ocr_summary"
            echo 'Classification: synthetic; not field/vendor accuracy or engineering acceptance.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          curl -fsS http://127.0.0.1:8000/api/v1/health/ready | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8080/api/v1/health/ready | grep -q '"status":"ok"'
          # The header probes use GET, not HEAD: these routes are registered for GET only, and a
          # HEAD request is answered with 405, which `curl -f` turns into a hard failure. `-D -`
          # writes the response headers to stdout so the same assertions run against a 200 reply.
          curl -fsS -D - -o /dev/null http://127.0.0.1:8080/api/v1/health/ready | grep -iq 'x-content-type-options: nosniff'
          curl -fsS -D - -o /dev/null http://127.0.0.1:8080/api/v1/health/ready | grep -iq 'content-security-policy:'
          curl -fsS -H "X-Dev-Roles: viewer" http://127.0.0.1:8080/api/v1/connectors/profiles | grep -q '"witsml.1.4.1.1.soap_http"'
          docker compose ps --format json
          {
            echo '### Docker Compose deployment smoke gate'
            echo '```'
            echo 'DOCKER_COMPOSE_SMOKE_OK: postgres, migrate, backend, connector-worker, and frontend verified.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CP135 OCR report on deployment-gate failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cp135-synthetic-ocr-report-${{ github.run_id }}
          path: ${{ runner.temp }}/cp135-synthetic-ocr-quality.json
          if-no-files-found: ignore
          retention-days: 14

      # ------------------------------------------------------------------ real-stack E2E
      # `npm run e2e` is the repository's own wrapper: it resolves a browser, refuses ports held by a
      # stale server, and lets Playwright start the API and the web server for all three deployments.
      # The whole suite runs — main, faults and auth — not a subset.
      - name: Verify the reviewed E2E inventory (shared manifest)
        working-directory: frontend
        run: npm run e2e:verify-shape

      - name: Run and verify real-browser E2E suite (main, faults and auth stacks)
        working-directory: frontend
        run: |
          set -o pipefail
          rm -f test-results/e2e-results.json
          set +e
          npm run e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          e2e_exit=${pipeline_status[0]:-1}
          tee_exit=${pipeline_status[1]:-1}
          if [ "$tee_exit" -ne 0 ]; then
            echo "::error::could not record the complete Playwright log (tee exit=$tee_exit)"
            exit 1
          fi
          verdict="$(node scripts/verify-e2e-run.mjs "$RUNNER_TEMP/e2e.log" "$e2e_exit" test-results/e2e-results.json)"
          echo "$verdict"
          notice_verdict="${verdict//%/%25}"
          notice_verdict="${notice_verdict//$'\r'/%0D}"
          notice_verdict="${notice_verdict//$'\n'/%0A}"
          notice_verdict="${notice_verdict//:/%3A}"
          notice_verdict="${notice_verdict//,/%2C}"
          echo "::notice title=Real-browser execution verified::$notice_verdict"
          {
            echo '### Real-browser E2E suite (main, faults and auth stacks)'
            echo '```'
            echo "$verdict"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------ evidence on failure
      # Artifacts are collected only when something failed, and collecting them does not change the
      # outcome of the run: the step above has already failed the job.
      - name: Upload Playwright evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-evidence-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  windows-certification:
    name: native Windows PowerShell install, backend, stack, and Playwright E2E certification
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      # Embedded pgserver PostgreSQL tests run in the Linux certification job; Windows certifies the
      # full SQLite backend suite (-m "not postgres"), multi-process stack, frontend, and Playwright E2E.
      DRILLAI_TEST_POSTGRES: '0'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provenance (Windows PowerShell)
        shell: pwsh
        run: |
          Write-Host "commit:  $(git rev-parse HEAD)"
          Write-Host "branch:  $(git branch --show-current)"
          Write-Host "subject: $(git log -1 --oneline)"
          Write-Host "os:      $([System.Environment]::OSVersion.VersionString)"
          Write-Host "pwsh:    $($PSVersionTable.PSVersion)"
          git status --porcelain

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Record Windows toolchain
        shell: pwsh
        run: |
          python --version
          python -m pip --version
          node --version
          npm --version

      - name: Bootstrap Windows workspace (scripts/bootstrap.ps1)
        shell: pwsh
        run: |
          & ./scripts/bootstrap.ps1

      - name: Frontend typecheck (Windows)
        working-directory: frontend
        shell: pwsh
        run: npm run typecheck

      - name: Frontend lint (Windows)
        working-directory: frontend
        shell: pwsh
        run: npm run lint

      - name: Frontend unit and component tests (Windows)
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $logFile = Join-Path $env:RUNNER_TEMP "win-frontend-tests.log"
          npm test 2>&1 | Tee-Object -FilePath $logFile
          if ($LASTEXITCODE -ne 0) { throw "Frontend unit tests failed on Windows" }
          $plain = (Get-Content $logFile -Raw) -replace "\x1b\[[0-9;]*[a-zA-Z]", ""
          $summaryMatch = [regex]::Match($plain, "(?m)^\s*Tests\s+\d+\s+passed[^\r\n]*")
          if (-not $summaryMatch.Success) {
            throw "Frontend unit tests did not print pass summary on Windows"
          }
          $summary = $summaryMatch.Value.Trim()
          if ($summary -match "\bskipped\b") { throw "Frontend unit tests reported skipped tests on Windows: $summary" }
          Write-Output "::notice title=Frontend unit tests verified::$summary"

      - name: Frontend production build (Windows)
        working-directory: frontend
        shell: pwsh
        run: npm run build

      - name: Supply-chain, SHA-pinning, and secret-leakage verification (Windows)
        shell: pwsh
        run: |
          .\backend\.venv\Scripts\python.exe scripts/verify_supply_chain_and_secrets.py
          if ($LASTEXITCODE -ne 0) { throw "verify_supply_chain_and_secrets.py failed on Windows" }

      - name: Backend lint (Windows)
        working-directory: backend
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m ruff check .

      - name: Migration check on fresh SQLite database (Windows)
        working-directory: backend
        shell: pwsh
        run: |
          $migDb = (Join-Path $env:RUNNER_TEMP "win-ci-migration.db") -replace "\\", "/"
          if (Test-Path $migDb) { Remove-Item -Force $migDb }
          $env:DRILLAI_DATABASE_URL = "sqlite+aiosqlite:///$migDb"
          .\.venv\Scripts\python.exe -m alembic upgrade head
          if ($LASTEXITCODE -ne 0) { throw "alembic upgrade head failed on Windows" }
          .\.venv\Scripts\python.exe -m alembic check
          if ($LASTEXITCODE -ne 0) { throw "alembic check failed on Windows" }

      - name: Backend SQLite test suite (Windows)
        id: backend_sqlite_tests
        working-directory: backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $logFile = Join-Path $env:RUNNER_TEMP "win-backend-tests.log"
          $junitFile = Join-Path $env:RUNNER_TEMP "win-backend-tests.xml"
          .\.venv\Scripts\python.exe -m pytest -rs -m "not postgres" "--junitxml=$junitFile" 2>&1 | Tee-Object -FilePath $logFile
          $pytestExit = $LASTEXITCODE
          & .\.venv\Scripts\python.exe ..\scripts\verify_backend_test_inventory.py `
            --platform windows `
            --log-file $logFile `
            --pytest-exit-code $pytestExit `
            --junit-xml-file $junitFile
          if ($LASTEXITCODE -ne 0) { throw "Backend test totals or the reviewed PostgreSQL/skip inventory failed verification" }

      - name: Upload Windows backend test log on failure
        if: failure() && steps.backend_sqlite_tests.conclusion == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-backend-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/win-backend-tests.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Multi-process stack verification on Windows (scripts/verify_stack.py)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $logFile = Join-Path $env:RUNNER_TEMP "win-verify-stack.log"
          .\backend\.venv\Scripts\python.exe scripts/verify_stack.py 2>&1 | Tee-Object -FilePath $logFile
          $stackExit = $LASTEXITCODE
          $content = Get-Content $logFile -Raw
          if ($stackExit -ne 0 -or $content -notmatch "STACK_VERIFICATION_OK") {
            $tailLines = ((Get-Content $logFile | Select-Object -Last 25) -join " | ")
            Write-Output "::error title=WindowsVerifyStackFailure::exit=$stackExit tail=[$tailLines]"
            throw "scripts/verify_stack.py failed on Windows"
          }

      - name: External vendor interop runner on Windows (scripts/verify_external_vendor_interop.py)
        shell: pwsh
        run: |
          .\backend\.venv\Scripts\python.exe scripts/verify_external_vendor_interop.py --mode harness
          if ($LASTEXITCODE -ne 0) { throw "verify_external_vendor_interop.py --mode harness failed on Windows" }
          .\backend\.venv\Scripts\python.exe scripts/verify_external_vendor_interop.py --mode external
          if ($LASTEXITCODE -ne 0) { throw "verify_external_vendor_interop.py --mode external failed on Windows" }

      - name: Verify the reviewed E2E inventory (shared manifest) (Windows)
        working-directory: frontend
        shell: pwsh
        run: |
          npm run e2e:verify-shape
          if ($LASTEXITCODE -ne 0) { throw "Playwright collection differs from ci/test-inventory.json" }

      - name: Run and verify real-browser Playwright suite (main, faults, and auth) (Windows)
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $logFile = Join-Path $env:RUNNER_TEMP "win-e2e.log"
          $reportFile = Join-Path $PWD "test-results/e2e-results.json"
          if (Test-Path $reportFile) { Remove-Item -Force $reportFile }
          npm run e2e 2>&1 | Tee-Object -FilePath $logFile
          $e2eExit = $LASTEXITCODE
          $verdict = & node scripts/verify-e2e-run.mjs $logFile $e2eExit $reportFile
          $verdictExit = $LASTEXITCODE
          if ($verdictExit -ne 0) { throw "Real Playwright execution did not match the reviewed manifest" }
          $verdictSummary = ($verdict | Select-Object -Last 1).Trim()
          if ([string]::IsNullOrWhiteSpace($verdictSummary)) { throw "Playwright verification printed no result summary" }
          $noticeVerdict = $verdictSummary.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A').Replace(':', '%3A').Replace(',', '%2C')
          Write-Output "::notice title=Real-browser execution verified::$noticeVerdict"

      - name: Upload Windows Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-playwright-evidence-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

